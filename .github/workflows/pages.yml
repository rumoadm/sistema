name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Gerar o site
        run: |
          npm run build
          cp dist/index.dev.html dist/index.html
          cp dist/index.html dist/404.html
          rm -rf assets
          mkdir -p assets
          cp -r dist/assets/. assets/
          cp dist/index.html index.html
          cp dist/404.html 404.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets
          if git diff --cached --quiet; then
            echo "O site publicado já está atualizado."
          else
            git commit -m "Atualiza o site publicado."
            git push
          fi
        env:
          GITHUB_PAGES: 'true'
      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
